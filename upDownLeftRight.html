<!DOCTYPE html>
<html lang="en">
<head>
<style>

body{
    margin:0;
    overflow:hidden;
}

#box{
    width:100px;
    height:100px;
    background:red;
    position:absolute;
    left:100px;
    top:100px;
}

</style>
</head>

<body>

<div id="box"></div>

<script>

const box = document.getElementById("box");

let x = 100;
let y = 100;
const speed = 10;

document.addEventListener("keydown", (event)=>{

    if(event.key == "ArrowRight"){
        x += speed;
    }

    if(event.key == "ArrowLeft"){
        x -= speed;
    }

    if(event.key == "ArrowUp"){
        y -= speed;
    }

    if(event.key == "ArrowDown"){
        y += speed;
    }

    box.style.left = x + "px";
    box.style.top = y + "px";

});

</script>

</body>
</html>
